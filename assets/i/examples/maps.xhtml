<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <title>Final Fantasy I map example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="/slothsoft@final-fantasy/i/css/default"/>
</head>
<body>
<article class="ff-contain">
    <h1>Map panel</h1>
    <p>The host supplies the map ID and label. Images require a configured US ROM.</p>
    <fieldset class="ff-ui ff-panel ff-flush" style="--ff-scale: 2">
        <legend>Ice Cave B1</legend>
        <img class="ff-pixel-art" src="/slothsoft@final-fantasy/i/gfx/map?map=15" alt="Ice Cave B1" width="1024" height="1024"/>
    </fieldset>
</article>
</body>
</html>
